# Connection parameters for the H2 test database.
#
# A file-backed database in AUTO_SERVER mode, not an in-memory one: MultiJVMPreferencesTest
# spawns a second JVM that connects to the very same database, and H2's mixed mode is the only
# way to share it across processes. All tests of this module share a single session opened by
# AbstractDbTest, hence a single URL.
#
# AbstractDbTest recreates the schema from META-INF/sql/H2/createttmodel.sql on every run,
# so a leftover database file from a previous run is harmless.
#
# The credentials are given explicitly, even though H2 would happily accept an anonymous
# connection: without them the session's user name would be passed to the driver, and tests
# that use the user name for other purposes (MultiUserDbPoolTest keys its sub-pools by it)
# would fail to connect.
url=jdbc:h2:./target/h2/tentackle;AUTO_SERVER=TRUE
user=tentackle
password=tentackle
