# Connection parameters for the PostgreSQL test database.
#
# Not used by default: backend.properties selects H2. Tests that genuinely need PostgreSQL
# (PostgresScriptRunnerTest, RemotePostgresExceptionTest) select this file explicitly via
# Pdo.createSessionInfo("postgres") or, for the TestServer, via --backend=postgres, and belong
# to the "postgres" group, which the default suite excludes. The database must have
# been created from the generated DDL beforehand.
url=${dbUrl}
user=${dbUser}
password=${dbPasswd}
