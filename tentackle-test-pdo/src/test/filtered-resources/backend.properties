# Connection parameters for the in-memory H2 test database.
#
# The tests own this database: AbstractPdoTest and TestApplication create the schema from the
# model whenever the backend is in-memory, so no database has to be set up to run the suite.
#
# DB_CLOSE_DELAY=-1 keeps the database alive while no connection is held. Without it, a pool
# that briefly drops its last connection (SessionPoolExecutorTest) would take the schema with it.
url=jdbc:h2:mem:default;DB_CLOSE_DELAY=-1

# The endpoint the out-of-process TestServer listens on (see TripServer).
service=${dbService}
