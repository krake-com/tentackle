# Connection parameters for the H2 test database.
#
# An in-memory database: unlike tentackle-database, no test of this module spawns a second JVM,
# so the schema never has to be shared across processes. All database-backed tests share the
# single session opened by AbstractPersistenceDbTest, which creates the schema on every run.
#
# DB_CLOSE_DELAY=-1 keeps the database alive while no connection is open, which matters because
# the modification tracker clones the session and may close its clone between polls.
#
# The credentials are given explicitly, even though H2 would happily accept an anonymous
# connection: without them the session's user name would be passed to the driver.
url=jdbc:h2:mem:persistence;DB_CLOSE_DELAY=-1
user=tentackle
password=tentackle
