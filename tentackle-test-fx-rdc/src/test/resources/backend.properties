# Connection parameters for the in-memory H2 test database.
#
# FxRdcTestApplication extends TestApplication, which creates the schema from the model
# whenever the backend is in-memory, so no database has to be set up to run the suite.
#
# Deliberately without DB_CLOSE_DELAY=-1, unlike tentackle-test-pdo: TestApplication opens the
# session per test class and creates the schema each time. H2 discards an in-memory database
# once the last connection closes, so every class starts from an empty one. Keeping the
# database alive across classes would make the second CREATE SEQUENCE fail.
url=jdbc:h2:mem:default
