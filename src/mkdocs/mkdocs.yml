  - Core Foundations:
      - Tentackle Core: core.md
      - Tentackle Common: common.md
      - Service and Configuration API: services.md
      - Cryptor and EncryptedProperties: cryptor.md
      - Naming Rules: naming-rules.md
      - Annotation Processors: annotation-processors.md
      - Binding — Connecting Models to Views: binding.md
      - Validation: validation.md
      - Interceptors: interceptors.md
      - Reflection — Class Mapping, Mixins, Proxies: reflect.md
      - Immutable — Switchable Read-Only Objects: immutable.md
      - Freezable: freezable.md
      - Preferences — Database-Backed Settings: preferences.md
