      - Model Definition Syntax: model-definition.md
      - Wurblets — Interface-Level Generation: wurblets.md
      - The DTO Wurblet and @RecordDTO: dto-wurblet.md
      - Persistence Wurblets: persistence-wurblets.md
      - PdoSelectList and PdoSelectUnique: pdo-select.md
      - Eager Relations: eager-relations.md
      - Embedded Entities vs. DataTypes: embedded-vs-datatype.md
  - Persistence & Database:
