site_name: Tentackle
site_description: >-
  Tentackle — a Java framework for building modular, multi-tier, domain-driven, enterprise-grade
  applications from a JDBC/SQL database up to a JavaFX desktop client, with a
  single, location-transparent programming model and full JPMS support.
site_url: https://tentackle.org/
repo_url: https://bitbucket.org/krake-oss/tentackle
repo_name: krake-oss/tentackle

# The docs/ tree is generated by prepare.py from the repository's real docs and
# README. Do not edit docs/ by hand — edit the sources under <module>/src/main/docs
# (and the repo README.md) instead.
docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  custom_dir: overrides
  logo: assets/favicon.png
  favicon: assets/favicon.png
  font:
    # Roboto matches tentackle.org. The privacy plugin localizes these fonts
    # at build time, so there are no requests to Google at runtime (GDPR).
    text: Roboto
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/bitbucket
  features:
    - navigation.top
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

# The nav mirrors src/main/docs/toc.md, using the flattened basenames produced
# by prepare.py (every doc filename across the reactor is unique).
nav:
  - Home: index.md
  - Getting Started:
      - Quickstart: quickstart.md
      - Project Archetype: tentackle-project-archetype.md
      - MyApp Walkthrough: myapp-walkthrough.md
      - For the Impatient: unexpected.md
      - Tentackle BOM: bom.md
  - Concepts & Architecture:
      - Tentackle Modules: modules.md
      - Multi-Tier Cascade: tiers.md
      - Correctness First: correctness-first.md
      - Exceptions and Error Handling: exceptions.md
      - Technical & Scientific Applications: technical-scientific.md
      - PDOs vs. Traditional ORMs: pdo-vs-orm.md
  - Persistent Domain Objects (PDO):
      - PDO — Persistent Domain Objects: pdo.md
      - The DomainContextProvider: domain-context-provider.md
      - Operation — Behavior Without an Entity: operation.md
      - Transactions and Transparent Retry: transaction.md
      - Domain Keys: domain-key.md
      - PDO Caching: cache.md
      - Number Sources: ns.md
      - Snapshots and Copies: snapshot.md
      - Security — Permissions, Rules, Grantees: security.md
      - The rootId and rootClassId Columns: root-columns.md
  - Model & Code Generation:
